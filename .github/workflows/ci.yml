name: Zepp OS Emulator CI & Test Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test Matrix (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build bundles (Browser & CLI)
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npm run test:unit

      - name: Run MCP Server Protocol Tests
        run: npm run test:mcp

      - name: Run Playwright Tests
        run: npm run test:playwright

      - name: Run Parameterized E2E Matrix Suites (Devices x API Levels)
        run: npm run test:suites

      - name: Run Test Coverage Battery
        run: npm run test:coverage

      - name: Verify CLI Executables
        run: |
          node bin/mcp.js --help || true
          node bin/zepp-playwright.js --help || true
